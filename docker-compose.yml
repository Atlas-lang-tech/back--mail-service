services:
  mail-service:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Point the discrete vars at the compose services (override .env defaults).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mail?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test:
        ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/mail/health']
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail
    ports:
      - '5432:5432'
    volumes:
      - mail-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - mail-redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - mail-rabbitmq-data:/var/lib/rabbitmq

volumes:
  mail-pg-data:
  mail-redis-data:
  mail-rabbitmq-data:
